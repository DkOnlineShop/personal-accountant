<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Personal Accountant</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Personal Accountant"><meta name="theme-color" content="#14282B">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F6F5;--sf:#FFFFFF;--tx:#14282B;--mu:#5E7275;--ln:#DCE4E2;--gr:#1B7A4B;--rd:#B73A2E;--grb:#E3F3EA;--rdb:#FBE6E3;--ink:#14282B;--onink:#FFFFFF;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1B1D;--sf:#172629;--tx:#E6EFEE;--mu:#93A8AA;--ln:#27393C;--gr:#5FC48E;--rd:#F08A7E;--grb:#16342A;--rdb:#3A1F1C;--ink:#E6EFEE;--onink:#0F1B1D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1B1D;--sf:#172629;--tx:#E6EFEE;--mu:#93A8AA;--ln:#27393C;--gr:#5FC48E;--rd:#F08A7E;--grb:#16342A;--rdb:#3A1F1C;--ink:#E6EFEE;--onink:#0F1B1D;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hind Siliguri",system-ui,sans-serif;font-size:16px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
h1{font-size:22px;margin:0;font-weight:700}
#lang{border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:inherit;font-size:14px;font-weight:600;padding:5px 12px;border-radius:99px;cursor:pointer}
.tabs{display:flex;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:4px;gap:4px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:15px;font-weight:600;padding:9px 4px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--onink)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.big{grid-column:1/-1;background:var(--ink);color:var(--onink);border-radius:14px;padding:16px 18px}
.big small{opacity:.75;font-size:14px;display:block}
.big b{font-size:38px;line-height:1.2;font-weight:700}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px 14px}
.box small{color:var(--mu);display:block;font-size:14px}
.box b{font-size:22px}
.g{color:var(--gr)}.r{color:var(--rd)}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:18px}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;border:1px solid var(--ln);background:none;color:var(--tx);font:inherit;padding:8px;border-radius:9px;cursor:pointer}
.seg button.on.out{background:var(--rdb);border-color:var(--rd);color:var(--rd);font-weight:600}
.seg button.on.in{background:var(--grb);border-color:var(--gr);color:var(--gr);font-weight:600}
input,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:9px;padding:10px 12px;margin-bottom:8px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.go{width:100%;border:0;background:var(--ink);color:var(--onink);font:inherit;font-weight:600;padding:11px;border-radius:10px;cursor:pointer}
h2{font-size:16px;margin:18px 0 8px;color:var(--mu);font-weight:600}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.it:last-child{border-bottom:0}
.it .m{flex:1;min-width:0}.it .m span{display:block;color:var(--mu);font-size:14px;overflow-wrap:anywhere}
.it b{white-space:nowrap}
.x{border:0;background:none;color:var(--mu);font:inherit;font-size:14px;cursor:pointer;padding:4px 6px}
.x.sure{color:var(--rd);font-weight:600}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;margin-bottom:8px}
.card summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;cursor:pointer}
.card summary::-webkit-details-marker{display:none}
.card .hist{padding:0 14px 6px;border-top:1px solid var(--ln)}
.tag{display:inline-block;font-size:13px;padding:1px 8px;border-radius:99px;margin-left:6px}
.tag.g{background:var(--grb)}.tag.r{background:var(--rdb)}
.empty{color:var(--mu);text-align:center;padding:18px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chips button{border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;font-size:14px;padding:4px 11px;border-radius:99px;cursor:pointer}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mu);margin-bottom:10px}.chk input{width:auto;margin:0}
.note{color:var(--mu);font-size:13px;text-align:center;margin-top:20px}
textarea{width:100%;font:inherit;font-size:13px;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:9px;padding:10px;margin:8px 0;resize:vertical}
.alt{background:none;color:var(--tx);border:1px solid var(--ln);margin-top:8px}
.hint{color:var(--mu);font-size:14px;margin:4px 0}
.chips .ed{border-color:var(--rd);color:var(--rd)}.chips .pl{border-style:dashed}
.hello{margin:0 0 14px;color:var(--mu)}.hello b{color:var(--tx)}
[hidden]{display:none!important}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14282B">
</head>
<body>
<main>
<header><h1>Personal Accountant</h1><button id="lang" onclick="toggleLang()">English</button></header>
<div id="who"></div>
<div class="tabs" role="tablist">
  <button role="tab" id="t-daily" aria-selected="true" onclick="setTab('daily')" data-i="tDaily"></button>
  <button role="tab" id="t-lg" aria-selected="false" onclick="setTab('lg')" data-i="tLg"></button>
  <button role="tab" id="t-bk" aria-selected="false" onclick="setTab('bk')" data-i="tBk"></button>
</div>

<section id="daily">
  <div class="sum" id="dsum"></div>
  <div class="panel">
    <div class="seg">
      <button class="out on" id="b-out" onclick="setDt('out')" data-i="out"></button>
      <button class="in" id="b-in" onclick="setDt('in')" data-i="in"></button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="row" id="catadd" hidden><input id="c-new" data-ph="newCat"><button class="go" style="flex:0 0 auto;width:auto;padding:0 18px;margin-bottom:8px" onclick="addCat()" data-i="addS"></button></div>
    <div class="row"><input id="d-a" inputmode="decimal" data-ph="amt"><input id="d-d" type="date"></div>
    <input id="d-n">
    <button class="go" onclick="addTx()" data-i="add"></button>
  </div>
  <div id="dlist"></div>
</section>

<section id="lg" hidden>
  <div class="sum" id="lsum"></div>
  <div class="panel">
    <input id="l-p" list="people" data-ph="person">
    <datalist id="people"></datalist>
    <select id="l-k">
      <option value="lend" data-i="lend"></option>
      <option value="borrow" data-i="borrow"></option>
      <option value="recvd" data-i="recvd"></option>
      <option value="paid" data-i="paid"></option>
    </select>
    <div class="row"><input id="l-a" inputmode="decimal" data-ph="amt"><input id="l-d" type="date"></div>
    <input id="l-n" data-ph="lnote">
    <label class="chk"><input type="checkbox" id="l-c" checked><span data-i="lcash"></span></label>
    <button class="go" onclick="addLg()" data-i="add"></button>
  </div>
  <div id="llist"></div>
</section>

<section id="bk" hidden>
  <div class="panel"><b data-i="bkTitle"></b>
  <p class="hint" data-i="bkHint"></p>
  <textarea id="bk-t" rows="4" readonly></textarea>
  <button class="go" onclick="copyBk()" data-i="copy"></button>
  <button class="go alt" onclick="dlBk()" data-i="file"></button>
  <p class="hint" id="bk-m"></p></div>
  <div class="panel"><b data-i="rsTitle"></b>
  <p class="hint" data-i="rsHint"></p>
  <textarea id="rs-t" rows="4" data-ph="rsPh"></textarea>
  <button class="go" onclick="restore()" data-i="rsBtn"></button>
  <p class="hint" id="rs-m"></p></div>
</section>
<p class="note" data-i="privacy"></p>
</main>

<script>
const T={
bn:{app:'Personal Accountant',tDaily:'দৈনিক খরচ',tLg:'দেনা-পাওনা',tBk:'ব্যাকআপ',out:'খরচ',in:'সেলারি / আয়',amt:'কত টাকা',add:'যোগ করুন',addS:'যোগ',
nOut:'কিসের জন্য',nIn:'যেমন: মাসের সেলারি',newCat:'নতুন ক্যাটাগরির নাম',editCats:'✎ ক্যাটাগরি বদলান',done:'✔ শেষ',
person:'কার সাথে (নাম)',lend:'ধার দিলাম (আমি পাব)',borrow:'ধার নিলাম (আমি দেব)',recvd:'টাকা ফেরত পেলাম',paid:'টাকা ফেরত দিলাম',lnote:'নোট (ঐচ্ছিক)',lcash:'আমার ক্যাশের হিসাবেও ধরুন',
lend_s:'ধার দিলাম',borrow_s:'ধার নিলাম',recvd_s:'ফেরত পেলাম',paid_s:'ফেরত দিলাম',
cash:'আমার মোট ক্যাশ',per:x=>`মাসের শেষ পর্যন্ত দিনে প্রায় ${x} খরচ করতে পারবেন`,nocash:'ক্যাশ শেষ, সেলারি যোগ করুন',
todayExp:'আজ খরচ',monthExp:'এই মাসে খরচ',monthIn:'এই মাসে সেলারি / আয়',spent:'খরচ',
emptyD:'প্রথমে "সেলারি / আয়" চেপে এই মাসের সেলারি লিখুন, তারপর প্রতিদিনের খরচ লিখুন।',
iget:'আমি পাব',iowe:'আমি দেব',tagGet:'পাব',tagOwe:'দেব',settled:'মিটে গেছে',
emptyL:'কারো সাথে লেনদেন নেই। কাউকে ধার দিলে বা কারো কাছ থেকে নিলে উপরে লিখুন।',
del:'মুছুন',sure:'নিশ্চিত?',defIn:'আয়',defOut:'খরচ',
catsOut:['নাস্তা','দুপুরের খাবার','রাতের খাবার','যাতায়াত','বাজার','রিচার্জ','অন্যান্য'],catsIn:['সেলারি','বোনাস','অন্য আয়'],
bkTitle:'ব্যাকআপ কোড',bkHint:'এই কোডে আপনার সব হিসাব ও ক্যাটাগরি আছে। কপি করে নিজের WhatsApp, Messenger বা ইমেইলে পাঠিয়ে রাখুন।',
copy:'কোড কপি করুন',file:'ফাইল হিসেবে সেভ করুন',
rsTitle:'হিসাব ফিরিয়ে আনুন',rsHint:'আগের কোডটি এখানে পেস্ট করুন। এখনকার কোনো হিসাব মুছবে না, শুধু হারানোগুলো যোগ হবে।',rsPh:'ব্যাকআপ কোড পেস্ট করুন',rsBtn:'ফিরিয়ে আনুন',
copied:'কপি হয়েছে। এটা নিজের WhatsApp, Messenger বা ইমেইলে সেভ করে রাখুন।',copyFail:'কপি হয়নি। উপরের লেখাটা চেপে ধরে সিলেক্ট করে কপি করুন।',
saved:'ফাইল সেভ হয়েছে।',saveFail:'ফাইল সেভ করা যায়নি। কোড কপি করে রাখুন।',
restored:n=>`হিসাব ফিরে এসেছে (${n}টি এন্ট্রি যোগ হয়েছে)।`,badCode:'কোডটি ঠিক নয়। পুরো কোড কপি করে পেস্ট করুন।',
privacy:'আপনার হিসাব শুধু আপনার, অন্য কেউ দেখতে পায় না।',other:'English',loc:'bn-BD',hello:'স্বাগতম',nameAsk:'শুরু করার আগে আপনার নাম লিখুন',namePh:'আপনার নাম',saveName:'সেভ করুন'},
en:{app:'Personal Accountant',tDaily:'Daily Expenses',tLg:'Debts',tBk:'Backup',out:'Expense',in:'Salary / Income',amt:'Amount',add:'Add',addS:'Add',
nOut:'What for',nIn:'e.g. Monthly salary',newCat:'New category name',editCats:'✎ Edit categories',done:'✔ Done',
person:"Person's name",lend:'I lent (I will get)',borrow:'I borrowed (I will owe)',recvd:'I got money back',paid:'I paid money back',lnote:'Note (optional)',lcash:'Also count in my cash',
lend_s:'Lent',borrow_s:'Borrowed',recvd_s:'Got back',paid_s:'Paid back',
cash:'My total cash',per:x=>`You can spend about ${x} per day until the month ends`,nocash:'Cash is finished, add your salary',
todayExp:"Today's spending",monthExp:'Spent this month',monthIn:'Salary / income this month',spent:'Spent',
emptyD:'First tap "Salary / Income" and add this month\'s salary, then add your daily expenses.',
iget:'I will get',iowe:'I will owe',tagGet:'To get',tagOwe:'To pay',settled:'Settled',
emptyL:'No debts yet. When you lend or borrow money, add it above.',
del:'Delete',sure:'Sure?',defIn:'Income',defOut:'Expense',
catsOut:['Breakfast','Lunch','Dinner','Transport','Groceries','Recharge','Other'],catsIn:['Salary','Bonus','Other income'],
bkTitle:'Backup code',bkHint:'This code holds all your accounts and categories. Copy it and send it to yourself on WhatsApp, Messenger or email.',
copy:'Copy code',file:'Save as file',
rsTitle:'Restore your data',rsHint:'Paste your earlier code here. Nothing you have now will be deleted; only the missing entries are added.',rsPh:'Paste backup code',rsBtn:'Restore',
copied:'Copied. Save it on your WhatsApp, Messenger or email.',copyFail:'Could not copy. Press and hold the text above, select it and copy.',
saved:'File saved.',saveFail:'Could not save the file. Please copy the code instead.',
restored:n=>`Restored (${n} entries added).`,badCode:'This code is not valid. Copy the whole code and paste it.',
privacy:'Your accounts are yours only; nobody else can see them.',other:'বাংলা',loc:'en-US',hello:'Welcome',nameAsk:'Enter your name to get started',namePh:'Your name',saveName:'Save'}
};
let L='bn';try{L=localStorage.getItem('khata-lang')==='en'?'en':'bn'}catch(e){}
const t=k=>T[L][k];
const $=s=>document.querySelector(s);
const bn=n=>Number(n).toLocaleString(t('loc'),{maximumFractionDigits:2});
const tk=n=>'৳'+bn(n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const m='০১২৩৪৫৬৭৮৯';const s=String(v).replace(/[০-৯]/g,c=>m.indexOf(c)).replace(/,/g,'').trim();const n=parseFloat(s);return isFinite(n)&&n>0?Math.round(n*100)/100:0};
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fd=s=>new Date(s+'T00:00:00').toLocaleDateString(t('loc'),{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const SIGN={lend:1,borrow:-1,recvd:-1,paid:1};

let S={tx:[],lg:[],cats:null,name:''},dt='out',pend=null,ref=null,tm=null,openSet=new Set(),ec=false;
function norm(d){return{tx:d.tx||[],lg:d.lg||[],cats:d.cats||null,name:d.name||''}}
try{const l=JSON.parse(localStorage.getItem('khata')||'null');if(l&&l.tx)S=norm(l)}catch(e){}

function save(){
  try{localStorage.setItem('khata',JSON.stringify(S))}catch(e){}
  clearTimeout(tm);
  tm=setTimeout(async()=>{try{if(ref)await ref.set(S)}catch(e){}},400);
}
(async()=>{try{
  const c=window.claude;if(!c)return;
  const db=await c.use('db'),u=await c.use('user');if(!db||!u)return;
  const id=await u.id();ref=db.doc('data/users/'+id+'/book');
  const s=await ref.get();
  if(s.exists){const d=s.data();if(d){S=norm(d);setDt(dt);render()}}
  else if(S.tx.length||S.lg.length){await ref.set(S)}
}catch(e){}})();

function applyLang(){
  document.documentElement.lang=L;document.title=t('app');
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=t(e.dataset.i)});
  document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph)});
  $('#lang').textContent=t('other');$('#bk-m').textContent='';$('#rs-m').textContent='';
  setDt(dt);render();
}
function toggleLang(){L=L==='bn'?'en':'bn';try{localStorage.setItem('khata-lang',L)}catch(e){}applyLang()}

function setTab(k){
  $('#daily').hidden=k!=='daily';$('#lg').hidden=k!=='lg';$('#bk').hidden=k!=='bk';
  ['daily','lg','bk'].forEach(x=>$('#t-'+x).setAttribute('aria-selected',x===k));
  if(k==='bk')showBk();
}
const cats=k=>(S.cats&&S.cats[k])||T[L][k==='out'?'catsOut':'catsIn'];
function setDt(k){
  dt=k;$('#b-out').classList.toggle('on',k==='out');$('#b-in').classList.toggle('on',k==='in');
  $('#d-n').placeholder=t(k==='in'?'nIn':'nOut');drawChips();
}
function drawChips(){
  const l=cats(dt);
  $('#chips').innerHTML=l.map((c,i)=>`<button class="${ec?'ed':''}" onclick="${ec?'rmCat':'pick'}(${i})">${ec?'✕ ':''}${esc(c)}</button>`).join('')+`<button class="pl" onclick="togEc()">${ec?t('done'):t('editCats')}</button>`;
  $('#catadd').hidden=!ec;
}
function togEc(){ec=!ec;drawChips();if(ec)$('#c-new').focus()}
function pick(i){$('#d-n').value=cats(dt)[i];$('#d-a').focus()}
function setCats(l){S.cats=S.cats||{out:cats('out').slice(),in:cats('in').slice()};S.cats[dt]=l;save();drawChips()}
function addCat(){const v=$('#c-new').value.trim();if(!v)return;const l=cats(dt).slice();if(!l.includes(v))l.push(v);$('#c-new').value='';setCats(l)}
function rmCat(i){const l=cats(dt).slice();l.splice(i,1);setCats(l)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

function addTx(){
  const a=num($('#d-a').value);if(!a){$('#d-a').focus();return}
  S.tx.push({id:uid(),d:$('#d-d').value||today(),t:dt,a,n:$('#d-n').value.trim()});
  $('#d-a').value='';$('#d-n').value='';save();render();
}
function addLg(){
  const p=$('#l-p').value.trim(),a=num($('#l-a').value);
  if(!p){$('#l-p').focus();return}if(!a){$('#l-a').focus();return}
  S.lg.push({id:uid(),d:$('#l-d').value||today(),p,k:$('#l-k').value,a,c:$('#l-c').checked,n:$('#l-n').value.trim()});
  $('#l-a').value='';$('#l-n').value='';openSet.add(p);save();render();
}
function del(kind,id){
  if(pend!==id){pend=id;render();setTimeout(()=>{if(pend===id){pend=null;render()}},3000);return}
  S[kind]=S[kind].filter(x=>x.id!==id);pend=null;save();render();
}
const delBtn=(kind,id)=>`<button class="x ${pend===id?'sure':''}" onclick="del('${kind}','${id}')">${pend===id?t('sure'):t('del')}</button>`;

function render(){renderWho();
  const td=today(),ym=td.slice(0,7);
  let ti=0,to=0,mi=0,mo=0;
  S.tx.forEach(x=>{if(x.d===td){x.t==='in'?ti+=x.a:to+=x.a}if(x.d.slice(0,7)===ym){x.t==='in'?mi+=x.a:mo+=x.a}});
  let cash=0;S.tx.forEach(x=>cash+=x.t==='in'?x.a:-x.a);S.lg.forEach(x=>{if(x.c)cash+=(x.k==='borrow'||x.k==='recvd')?x.a:-x.a});
  const dn=new Date(),dl=new Date(dn.getFullYear(),dn.getMonth()+1,0).getDate()-dn.getDate()+1,per=cash>0?Math.floor(cash/dl):0;
  $('#dsum').innerHTML=`<div class="big"><small>${t('cash')}</small><b>${cash<0?'−':''}${tk(Math.abs(cash))}</b><small>${cash>0?t('per')(tk(per)):t('nocash')}</small></div>
   <div class="box"><small>${t('todayExp')}</small><b class="r">${tk(to)}</b></div><div class="box"><small>${t('monthExp')}</small><b class="r">${tk(mo)}</b></div>
   <div class="box" style="grid-column:1/-1"><small>${t('monthIn')}</small><b class="g">${tk(mi)}</b></div>`;
  const days={};S.tx.forEach(x=>(days[x.d]=days[x.d]||[]).push(x));
  const ds=Object.keys(days).sort().reverse();
  $('#dlist').innerHTML=ds.length?ds.map(d=>{
    const l=days[d].slice().reverse();
    return `<h2>${fd(d)} — ${t('spent')} ${tk(days[d].reduce((s,x)=>s+(x.t==='out'?x.a:0),0))}</h2><div class="panel" style="padding:2px 14px">`+l.map(x=>`<div class="it"><div class="m"><b>${esc(x.n||(x.t==='in'?t('defIn'):t('defOut')))}</b></div><b class="${x.t==='in'?'g':'r'}">${x.t==='in'?'+':'−'}${tk(x.a)}</b>${delBtn('tx',x.id)}</div>`).join('')+`</div>`;
  }).join(''):`<div class="empty">${t('emptyD')}</div>`;

  const P={};S.lg.forEach(x=>{(P[x.p]=P[x.p]||{n:0,l:[]});P[x.p].n+=SIGN[x.k]*x.a;P[x.p].l.push(x)});
  let pay=0,owe=0;Object.values(P).forEach(p=>{p.n>0?pay+=p.n:owe-=p.n});
  $('#lsum').innerHTML=`<div class="box"><small>${t('iget')}</small><b class="g">${tk(pay)}</b></div><div class="box"><small>${t('iowe')}</small><b class="r">${tk(owe)}</b></div>`;
  $('#people').innerHTML=Object.keys(P).map(n=>`<option value="${esc(n)}">`).join('');
  const names=Object.keys(P).sort((a,b)=>Math.abs(P[b].n)-Math.abs(P[a].n));
  $('#llist').innerHTML=names.length?names.map(n=>{
    const p=P[n],c=p.n>0?'g':p.n<0?'r':'',lab=p.n>0?t('tagGet'):p.n<0?t('tagOwe'):t('settled');
    const hist=p.l.slice().sort((a,b)=>a.d<b.d?1:-1).map(x=>`<div class="it"><div class="m"><b>${t(x.k+'_s')}</b><span>${fd(x.d)}${x.n?' · '+esc(x.n):''}</span></div><b class="${SIGN[x.k]>0?'g':'r'}">${tk(x.a)}</b>${delBtn('lg',x.id)}</div>`).join('');
    return `<details class="card" data-p="${esc(n)}" ${openSet.has(n)?'open':''}><summary><b>${esc(n)}</b><span><b class="${c}">${p.n?tk(Math.abs(p.n)):''}</b><span class="tag ${c}">${lab}</span></span></summary><div class="hist">${hist}</div></details>`;
  }).join(''):`<div class="empty">${t('emptyL')}</div>`;
  document.querySelectorAll('details.card').forEach(el=>el.addEventListener('toggle',()=>{el.open?openSet.add(el.dataset.p):openSet.delete(el.dataset.p)}));
}

let editing=false;
function renderWho(){const el=$('#who');if(!S.name||editing){el.innerHTML=`<div class="panel"><b>${t('nameAsk')}</b><div class="row" style="margin-top:8px"><input id="u-n" value="${esc(S.name||'')}" placeholder="${t('namePh')}" maxlength="40"><button class="go" style="flex:0 0 auto;width:auto;padding:0 18px;margin-bottom:8px" onclick="saveName()">${t('saveName')}</button></div></div>`}else{el.innerHTML=`<p class="hello">${t('hello')}, <b>${esc(S.name)}</b> <button class="x" onclick="editName()">✎</button></p>`}}
function saveName(){const v=$('#u-n').value.trim();if(!v){$('#u-n').focus();return}S.name=v.slice(0,40);editing=false;save();renderWho()}
function editName(){editing=true;renderWho();$('#u-n').focus()}
const mk=()=>'KHATA1:'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));
const msg=(s,x)=>{$(s).textContent=x};
function showBk(){$('#bk-t').value=mk()}
async function copyBk(){const el=$('#bk-t');showBk();let ok=false;try{await navigator.clipboard.writeText(el.value);ok=true}catch(e){try{el.select();ok=document.execCommand('copy')}catch(e2){}}msg('#bk-m',ok?t('copied'):t('copyFail'))}
async function dlBk(){try{const d=await window.claude.use('downloads');if(!d)throw 0;await d.save({filename:'personal-accountant-backup.txt',data:mk()});msg('#bk-m',t('saved'))}catch(e){msg('#bk-m',t('saveFail'))}}
function restore(){try{
  const v=$('#rs-t').value.trim().replace(/^[^]*?KHATA1:/,'');
  const d=JSON.parse(decodeURIComponent(escape(atob(v.replace(/\s/g,'')))));if(!d||!Array.isArray(d.tx))throw 0;
  const a=new Set(S.tx.map(x=>x.id)),b=new Set(S.lg.map(x=>x.id));let n=0;
  if(d.name&&!S.name)S.name=d.name;
  d.tx.forEach(x=>{if(!a.has(x.id)){S.tx.push(x);n++}});(d.lg||[]).forEach(x=>{if(!b.has(x.id)){S.lg.push(x);n++}});
  if(d.cats){S.cats=S.cats||{out:cats('out').slice(),in:cats('in').slice()};['out','in'].forEach(k=>(d.cats[k]||[]).forEach(c=>{if(!S.cats[k].includes(c))S.cats[k].push(c)}))}
  save();drawChips();render();msg('#rs-m',t('restored')(bn(n)));
}catch(e){msg('#rs-m',t('badCode'))}}

try{const c=document.createElement('canvas');c.width=c.height=192;const g=c.getContext('2d');g.fillStyle='#14282B';g.fillRect(0,0,192,192);g.fillStyle='#fff';g.font='700 120px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('৳',96,100);const u=c.toDataURL('image/png');['apple-touch-icon','icon'].forEach(r=>{const l=document.createElement('link');l.rel=r;l.href=u;document.head.appendChild(l)})}catch(e){}
$('#d-d').value=today();$('#l-d').value=today();
dt=S.tx.some(x=>x.t==='in')?'out':'in';
applyLang();
</script>
